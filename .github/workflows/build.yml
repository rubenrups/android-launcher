name: Build APK

on:
  # One build per push (a push already shows up as a check on its pull request, so no pull_request trigger).
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# A newer push to the same branch makes an unfinished older build pointless: cancel it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit, not a tag a maintainer (or an attacker) can move.
# To update one: look up the new commit of the tag you want and replace the hash and the comment.
jobs:
  build:
    runs-on: ubuntu-latest
    # The build job can read the repository and nothing else; only the publish job below may write.
    permissions:
      contents: read
    outputs:
      signed: ${{ env.HAS_SIGNING_KEY }}
    env:
      # Only builds that have the private release key (see app/build.gradle.kts) are signed for updates.
      HAS_SIGNING_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # setup-gradle also checks that gradle-wrapper.jar is an official Gradle one.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Branch builds may refresh the Gradle cache too (the default only lets the main branch write it).
          cache-read-only: false

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --stacktrace
          rm -f "$RUNNER_TEMP/release.keystore"

      # No key (a fork, or the secrets are not set up yet): still prove that the code builds, but publish nothing.
      - name: Build debug APK
        if: env.HAS_SIGNING_KEY != 'true'
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rups-launcher-apk
          path: app/build/outputs/apk/*/*.apk
          retention-days: 7

  # Each push to main becomes a pre-release "build-N" (N = the app's versionCode), which is what the in-app
  # update check looks for. Other branches never publish, so a stray branch cannot become an update on the phone.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rups-launcher-apk
          path: apk

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          # The launcher shows this as "What's new" before you install.
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          files: apk/app-release.apk

      # Every push leaves a "build-N" pre-release behind. Keep the newest 10 (the in-app update check only
      # ever looks at the newest) and delete the rest together with their tags.
      - name: Prune old pre-releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq 'map(select(.tagName | startswith("build-"))) | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
